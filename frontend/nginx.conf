# ==============================================================================
# Simmer Frontend Production Nginx Configuration
# ==============================================================================
# This configuration serves the compiled Vite React Single Page Application (SPA)
# and acts as an API gateway / reverse-proxy forwarding `/api/` traffic to the
# backend FastAPI service.
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    # Root directory containing the built React assets (copied from Vite builder)
    root /usr/share/nginx/html;
    index index.html index.htm;

    # --------------------------------------------------------------------------
    # Gzip Asset Compression
    # --------------------------------------------------------------------------
    # Compresses static text, CSS, JS, and SVG assets in transit to dramatically
    # reduce payload sizes and improve client page load times (Audit INF-4.0.4).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # --------------------------------------------------------------------------
    # Security Headers (Defense-in-Depth)
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # --------------------------------------------------------------------------
    # Frontend SPA Routing (HTML5 History Mode)
    # --------------------------------------------------------------------------
    # For any route accessed directly (e.g. /feed, /profile, /recipes/12):
    # Nginx checks if a physical file exists ($uri), then a directory ($uri/).
    # If neither exists, it serves /index.html so React Router takes over routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # Long-term Caching for Immutable Static Assets
    # --------------------------------------------------------------------------
    # Vite bundles assets with content hashes in filenames (e.g. index-D_5oP82Q.js).
    # These can safely be cached by browsers for months without stale cache bugs.
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # Reverse Proxy for Backend API Requests
    # --------------------------------------------------------------------------
    # Routes all `/api/` calls seamlessly to the backend container over Docker network.
    # Eliminates CORS issues in production environments.
    location /api/ {
        # 'backend' resolves via Docker Compose internal DNS
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        # Forward real client connection information to FastAPI
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if real-time subscriptions are enabled)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Proxy timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # Nginx Container Health Check Endpoint
    # --------------------------------------------------------------------------
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }
}
