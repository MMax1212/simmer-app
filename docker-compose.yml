services:
  db:
    image: postgres:16-alpine
    container_name: simmer_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: simmer_db
      POSTGRES_USER: simmer_user
      POSTGRES_PASSWORD: simmer_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simmer_user -d simmer_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: simmer_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://simmer_user:simmer_password@db:5432/simmer_db
      PORT: 8000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: simmer_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
